services:
  postgres:
    image: postgres:17-alpine
    container_name: smart-reactive-safety-system-postgres
    restart: always
    ports:
      - "5433:5432"
    environment:
      POSTGRES_USER: srss
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: srss
    volumes:
      - smart-reactive-safety-system-postgres-data:/var/lib/postgresql/data

  redis:
    image: redis:alpine
    container_name: smart-reactive-safety-system-redis
    restart: always
    ports:
      - "6379:6379"

volumes:
  smart-reactive-safety-system-postgres-data:
